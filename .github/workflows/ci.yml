name: CI

# Runs the checks that exist in this repo, on every pull request and on main.
# Deliberately credential-free: no repository secrets are referenced, nothing is
# deployed, and nothing outside this runner is modified. `verify:seed` is offline
# by construction and `verify:sitemap` falls back to a structural check when no
# Sanity project ID is configured.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, build, verify, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify seeded content mapping
        run: npm run verify:seed

      - name: Verify sitemap
        run: npm run verify:sitemap

      # Builds again inside Playwright's webServer step, then serves the
      # production bundle with `vite preview`. There is no VITE_META_PIXEL_ID
      # here, so the pixel never loads and no external host is contacted.
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
