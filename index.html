<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D0D5B" />
    <script>
      // Apply saved theme before first paint to avoid a light→dark flash.
      (function () {
        try {
          if (localStorage.getItem("ek-theme") === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
    <title>Edward Kwinane | AI Implementation Specialist</title>
    <meta
      name="description"
      content="Explore Edward Kwinane's approach to AI implementation, connecting business opportunities with AI strategy, engineering, integration and practical solutions."
    />
    <link rel="canonical" href="https://edward-kwinane.vercel.app/" />
    <!--
      Social metadata is declared here as well as in Seo.tsx so it exists in the
      initial HTML for crawlers and link unfurlers that do not run JavaScript.
      These static values are absolute, per the Open Graph spec, and use the
      production origin; Seo.tsx keeps them in sync per route at runtime,
      resolving the origin from the live location so a future custom domain
      needs no change there.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Edward Kwinane" />
    <meta property="og:title" content="Edward Kwinane | AI Implementation Specialist" />
    <meta
      property="og:description"
      content="Explore Edward Kwinane's approach to AI implementation, connecting business opportunities with AI strategy, engineering, integration and practical solutions."
    />
    <meta property="og:url" content="https://edward-kwinane.vercel.app/" />
    <meta property="og:image" content="https://edward-kwinane.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Edward Kwinane | AI Implementation Specialist"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Edward Kwinane | AI Implementation Specialist" />
    <meta
      name="twitter:description"
      content="Explore Edward Kwinane's approach to AI implementation, connecting business opportunities with AI strategy, engineering, integration and practical solutions."
    />
    <meta name="twitter:image" content="https://edward-kwinane.vercel.app/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Edward Kwinane | AI Implementation Specialist"
    />
    <script type="application/ld+json" id="structured-data">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://edward-kwinane.vercel.app/#person",
            "name": "Edward Kwinane",
            "jobTitle": "AI Implementation Specialist",
            "url": "https://edward-kwinane.vercel.app",
            "description": "Explore Edward Kwinane's approach to AI implementation, connecting business opportunities with AI strategy, engineering, integration and practical solutions.",
            "sameAs": [
              "https://www.linkedin.com/in/edward-kwinane",
              "https://github.com/edwardkwinane"
            ]
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
