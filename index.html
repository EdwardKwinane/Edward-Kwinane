<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D0D5B" />
    <script>
      // Apply saved theme before first paint to avoid a light→dark flash.
      (function () {
        try {
          if (localStorage.getItem("ek-theme") === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
    <title>Edward Kwinane — AI Engineer &amp; Digital Architect</title>
    <meta
      name="description"
      content="Edward Kwinane is an AI Engineer & Digital Architect specializing in AI voice agents, RAG systems, AI chatbots, AI agents and rapid full-stack product development."
    />
    <!--
      Social metadata is declared here as well as in Seo.tsx so it exists in the
      initial HTML for crawlers and link unfurlers that do not run JavaScript.
      Seo.tsx keeps these in sync per route; absolute URLs are resolved at runtime
      from the live origin so a future custom domain needs no change here.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Edward Kwinane" />
    <meta property="og:title" content="Edward Kwinane — AI Engineer &amp; Digital Architect" />
    <meta
      property="og:description"
      content="Edward Kwinane is an AI Engineer & Digital Architect specializing in AI voice agents, RAG systems, AI chatbots, AI agents and rapid full-stack product development."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Edward Kwinane — AI Engineer &amp; Digital Architect" />
    <meta
      name="twitter:description"
      content="Edward Kwinane is an AI Engineer & Digital Architect specializing in AI voice agents, RAG systems, AI chatbots, AI agents and rapid full-stack product development."
    />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
